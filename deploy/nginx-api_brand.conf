# Nginx reverse proxy untuk platform-api
# Simpan di: /etc/nginx/sites-available/api_brand
# Enable: sudo ln -sf /etc/nginx/sites-available/api_brand /etc/nginx/sites-enabled/
#
# Ganti server_name jika sudah punya domain (disarankan).

server {
    listen 80;
    listen [::]:80;
    server_name 103.31.204.10 api.solasoli.local;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
